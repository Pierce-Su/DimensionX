name: vggt_gp
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - conda-forge::opencv
  - conda-forge::numpy
  - conda-forge::pillow
  - conda-forge::scipy
  - pip:
      # Force CUDA 12.8 torch wheels; all other packages fall back to PyPI
      # torch>=2.9 has no cu128 wheel — pip falls back to PyPI and pulls a
      # CUDA 13.0 build, which mismatches the system CUDA 12.8 toolkit.
      # Constraining to >=2.7,<2.9 keeps pip on the cu128 index.
      - --index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.org/simple
      - torch>=2.7,<2.9
      - torchvision
      # VGGT core deps
      - huggingface_hub
      - einops
      - safetensors
      # COLMAP binary I/O (required by vggt.dependency.np_to_pycolmap)
      - pycolmap==3.8.0
      # 3D / visualisation
      - trimesh
      - plyfile
      # BA tracker deps (only needed with --use_ba)
      - git+https://github.com/cvg/LightGlue.git
      # Misc
      - tqdm
      - tensorboard
      - matplotlib
      - open3d
      # GaussianPro runtime deps
      - imageio          # used by train.py and render.py for frame I/O
      - imageio-ffmpeg   # imageio video backend (optional but avoids runtime warnings)
      # GaussianPro CUDA extensions — build from submodules after env creation:
      #   pip install --no-build-isolation \
      #       third_party/GaussianPro/submodules/diff-gaussian-rasterization \
      #       third_party/GaussianPro/submodules/simple-knn \
      #       third_party/GaussianPro/submodules/Propagation
      #
      # NOTE: the following patches are already applied in the submodule source tree:
      #   • diff-gaussian-rasterization/cuda_rasterizer/rasterizer_impl.h — add #include <cstdint>
      #   • simple-knn/simple_knn.cu                                       — add #include <cfloat>
      # Both are required for CUDA 12+ / C++17 toolchains.
